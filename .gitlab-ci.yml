# GitLab's hosted Windows runners (Windows Server 2022). WPF and the Windows service only build
# for Windows, and the .NET 10 SDK isn't preinstalled there, so each job installs it first.
# GitHub builds and releases the same tags on its own (.github/workflows/release.yml).

default:
  tags: [saas-windows-medium-amd64]
  before_script:
    - $ErrorActionPreference = 'Stop'
    - Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
    - ./dotnet-install.ps1 -Channel 10.0 -InstallDir "$env:CI_PROJECT_DIR\.dotnet"
    - $env:PATH = "$env:CI_PROJECT_DIR\.dotnet;$env:PATH"
    - $env:DOTNET_CLI_TELEMETRY_OPTOUT = '1'
    - $env:DOTNET_NOLOGO = '1'

stages: [test, package, release]

test:
  stage: test
  script:
    - dotnet build WireGuardBar.sln -c Release
    - if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - dotnet test tests/WireGuardBar.Core.Tests -c Release --no-build
    - if ($LASTEXITCODE) { exit $LASTEXITCODE }

setup:
  stage: package
  script:
    - ./scripts/package.ps1   # installs Inno Setup if missing; version comes from the tag
    # fixed name at the root, for a stable raw link:
    # https://gitlab.com/PioneerSwine996/wireguard-bar-windows/-/jobs/artifacts/main/raw/WireGuardBar-Setup.exe?job=setup
    - Move-Item dist/WireGuardBar-Setup.exe WireGuardBar-Setup.exe
  artifacts:
    name: "WireGuardBar-Setup-$CI_COMMIT_REF_SLUG"
    paths:
      - WireGuardBar-Setup.exe
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# On a version tag (v1.2.3): a GitLab Release linking the installer from the setup job. The job
# token may create releases for its own project, so no secrets are needed. Runs on the Windows
# runner too (no .NET needed), so it doesn't depend on shared Linux runners.
release:
  stage: release
  needs: [setup]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script: []
  script:
    - $ErrorActionPreference = 'Stop'
    - |
      $body = @{
        tag_name    = $env:CI_COMMIT_TAG
        name        = "WireGuard Bar for Windows $env:CI_COMMIT_TAG"
        description = 'Download WireGuardBar-Setup.exe below. See CHANGELOG.md for what changed.'
        assets      = @{ links = @(@{
          name      = 'WireGuardBar-Setup.exe'
          url       = "$env:CI_PROJECT_URL/-/jobs/artifacts/$env:CI_COMMIT_TAG/raw/WireGuardBar-Setup.exe?job=setup"
          link_type = 'package'
        }) }
      } | ConvertTo-Json -Depth 5
      Invoke-RestMethod -Method Post -Uri "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/releases" `
        -Headers @{ 'JOB-TOKEN' = $env:CI_JOB_TOKEN } -ContentType 'application/json' -Body $body
